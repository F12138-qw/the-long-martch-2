  <script src="../js/game.js"></script>
  <script>
    initGame({
      chapter: 4,
      title: '飞夺泸定桥',
      date: '1935年5月',
      story: '1935年5月，红军巧渡金沙江后，大渡河横在面前。蒋介石扬言要让红军成为“石达开第二”，企图围歼红军于大渡河畔。要过大渡河，必须夺取泸定桥——而此刻，距离泸定桥还有240里山路，时间只剩一昼夜——',
      options: [
        {
          text: '昼夜兼程，奔袭夺取泸定桥',
          correct: true,
          cost: { soldiers: 0 },
          afterText: '红四团一昼夜急行军240里，抢在敌人增援之前抵达泸定桥。22名突击队员攀踏铁索，冒着密集火力强夺泸定桥，为大部队渡河打开了生路。红军随后迅速渡过大渡河，粉碎了蒋介石的围歼图谋。'
        },
        {
          text: '原地休整，等体力恢复再走',
          correct: false,
          cost: { soldiers: -6000, ammo: -10 },
          popupTitle: '史实科普 · 为什么不能休整拖延',

        },
        {
          text: '放弃泸定桥，绕道翻越大山',
          correct: false,
          cost: { soldiers: -8000, food: -15 },
          popupTitle: '史实科普 · 为什么必须夺取泸定桥',
          popupText: '大渡河两岸悬崖陡壁，除泸定桥外没有更可行的大规模通路；绕行将进入敌军重兵布防区域，且地形更险、补给更难。夺取泸定桥，是当时打通北上通道唯一现实的选择。'
        }
      ],
      next: 5
    });

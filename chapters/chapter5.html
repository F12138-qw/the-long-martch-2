  <script src="../js/game.js"></script>
  <script>
    initGame({
      chapter: 5,
      title: '翻越夹金山',
      date: '1935年6月',
      story: '1935年6月，中央红军到达夹金山下。这座“神山”主峰海拔4000多米，终年积雪、空气稀薄、天气瞬息万变。战士们缺衣少粮，却必须翻过它，才能与红四方面军会师。面对这座大雪山——',
      options: [
        {
          text: '相互搀扶，缓步翻越雪山',
          correct: true,
          cost: { soldiers: -3000 },
          afterText: '1935年6月12日至18日，中央红军分批翻越夹金山——这是中央红军长征中翻越的第一座大雪山。翻过雪山后，红军与红四方面军在懋功（今小金县）达维地区胜利会师。'
        },
        {
          text: '快速奔跑冲上山顶',
          correct: false,
          cost: { soldiers: -8000 },
          popupTitle: '史实科普 · 为什么不能急速奔跑',

        {
          text: '就地驻扎，等天气转暖再翻越',

        }
      ],
      next: 6
    });
